name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

  # The Tag workflow calls this one with the tag it just pushed: a tag pushed
  # with the workflow token does not start other workflows on its own.
  workflow_call:
    inputs:
      ref:
        description: The tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
